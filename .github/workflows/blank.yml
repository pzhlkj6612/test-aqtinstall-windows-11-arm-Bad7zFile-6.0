name: CI
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        os:
          - windows-2025      # x86_64
          - windows-11-arm    # aarch64
          - ubuntu-24.04      # x86_64
          - ubuntu-24.04-arm  # aarch64
          - macos-15-intel    # x86_64
          - macos-26          # aarch64
        qt_ver:
          # https://wiki.qt.io/Qt_6.0_Release
          - 6.0.0
          - 6.0.1
          - 6.0.2
          - 6.0.3
          - 6.0.4
          # https://wiki.qt.io/Qt_6.1_Release
          - 6.1.0
          - 6.1.1
          - 6.1.2
          - 6.1.3
          # https://wiki.qt.io/Qt_6.2_Release
          - 6.2.0
          - 6.2.1
          - 6.2.2
          - 6.2.3
          - 6.2.4
          # https://wiki.qt.io/Qt_6.3_Release
          - 6.3.0
          - 6.3.1
          - 6.3.2
          # https://wiki.qt.io/Qt_6.4_Release
          - 6.4.0
          - 6.4.1
          - 6.4.2
          - 6.4.3
          # https://wiki.qt.io/Qt_6.5_Release
          - 6.5.0
          - 6.5.1
          - 6.5.2
          - 6.5.3
          # https://wiki.qt.io/Qt_6.6_Release
          - 6.6.0
          - 6.6.1
          - 6.6.2
          - 6.6.3
          # https://wiki.qt.io/Qt_6.7_Release
          - 6.7.0
          - 6.7.1
          - 6.7.2
          - 6.7.3
        iqta_setup_py: ['true', 'false']
        aqt_commit: 
          - 'b22c86daef2ceeab6635ee0851e089f7346ec286'  # Jun  2, 2025, v3.3.0
          - '38508ec702620c98c91eb734dd5fb9cf487d5927'  # Jan  5, 2026, random commit
          - '8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'  # Mar 24, 2026, PR #1000 fixes Qt 6.11 on Windows
          - '16db45a70b5905ad596941b223469bc86a56901e'  # Jul 22, 2026, latest master
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Python
        if: ${{ matrix.iqta_setup_py == 'false' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          setup-python: ${{ matrix.iqta_setup_py }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@${{ matrix.aqt_commit }}"
